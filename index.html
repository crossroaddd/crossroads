<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CROSSROADS — Artists Agency</title>
<meta name="description" content="CROSSROADS — artists agency and artist management. Built around artists, driven by strategy, and focused on your next crossroads.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CROSSROADS — design tokens
   Derived from the logo: stencil cross, pure monochrome,
   hard edges, heavy grotesk, bar-based composition.
   ============================================================ */
:root{
  --ink:#000000;
  --paper:#F2F0EA;
  --white:#FFFFFF;
  --ash:#8E8E88;
  --line:rgba(0,0,0,.14);
  --line-inv:rgba(255,255,255,.18);

  --bar:clamp(56px,6.5vw,76px);   /* header bar height — echoes the logo's arm */
  --gut:clamp(16px,4vw,56px);

  --font:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font);
  font-weight:400;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:var(--ink);color:var(--paper)}

/* ---------- shared bits ---------- */
.eyebrow{
  font-size:11px;font-weight:700;
  letter-spacing:.22em;text-transform:uppercase;
}
.plus{ /* the core motif: two crossing bars */
  position:relative;display:inline-block;
  width:1em;height:1em;flex:none;
}
.plus::before,.plus::after{content:"";position:absolute;background:currentColor}
.plus::before{inset:42% 0}
.plus::after{inset:0 42%}

/* ============================================================
   HEADER — a horizontal bar, like the logo's horizontal arm
   ============================================================ */
.hdr{
  position:fixed;inset:0 0 auto 0;z-index:100;
  height:var(--bar);
  display:flex;align-items:center;gap:var(--gut);
  padding:0 var(--gut);
  background:var(--ink);color:var(--white);
}
.hdr__logo{width:clamp(112px,13vw,168px);color:var(--white)}
.hdr__nav{margin-left:auto;display:flex;align-items:center;gap:clamp(14px,2.2vw,34px)}
.hdr__nav a{
  font-size:11px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;
  opacity:.62;transition:opacity .25s var(--ease);
}
.hdr__nav a:hover{opacity:1}
.hdr__cta{
  display:inline-flex;align-items:center;gap:.6em;
  height:34px;padding:0 16px;
  background:var(--white);color:var(--ink);
  font-size:11px;font-weight:800;
  letter-spacing:.16em;text-transform:uppercase;
  transition:transform .3s var(--ease);
}
.hdr__cta:hover{transform:translateY(-2px)}
.hdr__cta .plus{font-size:9px}

/* ============================================================
   HERO
   ============================================================ */
.hero{
  position:relative;
  min-height:100svh;
  padding:calc(var(--bar) + clamp(36px,8vh,100px)) var(--gut) 0;
  background:var(--ink);color:var(--white);
  display:flex;flex-direction:column;
  overflow:hidden;
}
/* one row: mark on the left, actions on the right, sharing a centre line */
.hero__inner{
  position:relative;flex:1;
  display:flex;align-items:center;justify-content:space-between;
  gap:clamp(24px,5vw,80px);
  width:100%;
}

.hero__mark{
  /* 1920:768 = 2.5 — capping width by vh keeps the mark inside the fold */
  width:min(64%,92vh,1000px);
  flex:0 1 auto;
  color:var(--white);
  /* the letters are knocked out of the bar → the black field reads through them */
}
.hero__mark svg{width:100%;height:auto}

.hero__actions{display:flex;gap:10px;flex-wrap:wrap;flex:none}

.btn{
  display:inline-flex;align-items:center;gap:.85em;
  height:52px;padding:0 26px;
  background:var(--white);color:var(--ink);
  font-size:12px;font-weight:800;
  letter-spacing:.18em;text-transform:uppercase;
  position:relative;overflow:hidden;
  transition:color .35s var(--ease);
}
.btn span{position:relative;z-index:1;display:inline-flex;align-items:center;gap:.85em}
.btn::before{
  content:"";position:absolute;inset:0;background:var(--ash);
  transform:scaleY(0);transform-origin:bottom;
  transition:transform .4s var(--ease);
}
.btn:hover::before{transform:scaleY(1)}
.btn--ghost{background:transparent;color:var(--white);box-shadow:inset 0 0 0 1px rgba(255,255,255,.34)}
.btn .plus{font-size:10px;transition:transform .4s var(--ease)}
.btn:hover .plus{transform:rotate(90deg)}

/* ---------- ticker band ---------- */
.ticker{
  margin:0 calc(var(--gut) * -1);
  border-top:1px solid var(--line-inv);
  border-bottom:1px solid var(--line-inv);
  overflow:hidden;padding:14px 0;
}
.ticker__track{display:flex;width:max-content;animation:slide 34s linear infinite}
.ticker__track span{
  display:inline-flex;align-items:center;gap:26px;
  padding-right:26px;
  font-size:12px;font-weight:700;
  letter-spacing:.24em;text-transform:uppercase;
  white-space:nowrap;color:rgba(255,255,255,.72);
}
.ticker .plus{font-size:8px;opacity:.6}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ============================================================
   ROSTER / CAROUSEL
   ============================================================ */
/* keep anchor jumps clear of the fixed header bar */
#roster,#contact{scroll-margin-top:var(--bar)}

.roster{padding:clamp(60px,10vh,120px) 0 clamp(56px,9vh,104px)}
.roster__head{
  padding:0 var(--gut) clamp(26px,4vh,44px);
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:24px;
}
.roster__title{
  margin:0;
  font-size:clamp(44px,9vw,136px);
  font-weight:900;line-height:.84;letter-spacing:-.045em;
  text-transform:uppercase;
}
.roster__aside{margin-left:auto;display:flex;align-items:flex-end;gap:clamp(18px,3vw,40px)}
.roster__count{font-size:12px;font-weight:800;letter-spacing:.2em;padding-bottom:2px;white-space:nowrap}

.nav{display:flex;gap:8px}
.nav button{
  width:46px;height:46px;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px var(--ink);
  transition:background .3s var(--ease),color .3s var(--ease),opacity .3s;
}
.nav button:hover{background:var(--ink);color:var(--paper)}
.nav button[disabled]{opacity:.22;pointer-events:none}
.nav svg{width:15px;height:15px}

/* track */
.rail{
  display:flex;gap:1px;
  padding:0 var(--gut);
  overflow-x:auto;
  overflow-y:hidden;
  /* 'proximity', not 'mandatory': mandatory fights any vertical wheel/trackpad
     gesture that passes over the rail and makes the page feel like it snags */
  scroll-snap-type:x proximity;
  scroll-padding-left:var(--gut);   /* without this the first snap eats the gutter */
  scroll-padding-right:var(--gut);
  overscroll-behavior-x:contain;    /* don't chain sideways scroll to the page */
  touch-action:pan-x pan-y;         /* vertical page scroll always wins on touch */
  scrollbar-width:none;-ms-overflow-style:none;
  cursor:grab;
  border-top:1px solid var(--ink);
  border-bottom:1px solid var(--ink);
  background:var(--ink);           /* the 1px gaps read as hairlines */
}
.rail::-webkit-scrollbar{display:none}
.rail.is-drag{cursor:grabbing;scroll-snap-type:none}
.rail.is-drag *{pointer-events:none}

.card{
  scroll-snap-align:start;
  flex:0 0 min(80vw,320px);   /* phone default: one card plus a peek */
  background:var(--paper);
  display:flex;flex-direction:column;
}

.card__media{position:relative;aspect-ratio:3/4;overflow:hidden;background:#171717;color:#fff}
/* the page is monochrome by design, so the artists are the only colour in it */
.card__media img{
  position:absolute;inset:0;
  width:100%;height:100%;object-fit:cover;
  transition:transform 1s var(--ease);
}
@media (hover:hover){
  .card:hover .card__media img{transform:scale(1.04)}
}
/* --- placeholder artwork: dot grid + spotlight + stencil initial ---
   scoped to the three layer classes so it never catches a .plus icon --- */
.card__media > i.dots,
.card__media > i.glow,
.card__media > i.bars{position:absolute;inset:0}
.card__media i.dots{
  background-image:radial-gradient(currentColor 1px,transparent 1.1px);
  background-size:9px 9px;color:rgba(255,255,255,.16);
  transition:transform 1s var(--ease);
}
.card__media i.glow{background:radial-gradient(58% 46% at 50% 38%,rgba(255,255,255,.32),transparent 72%)}
.card__media i.bars{background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px);mix-blend-mode:overlay}
.card:nth-child(2n) .card__media{background:#0B0B0B}
.card:nth-child(3n) .card__media{background:#202020}
.card:nth-child(3n) .card__media i.dots{background-size:14px 14px}
.card:nth-child(4n) .card__media i.bars{background-image:repeating-linear-gradient(-115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 12px)}
.card:nth-child(5n) .card__media i.dots{background-size:6px 6px;color:rgba(255,255,255,.2)}

.card__initial{
  position:absolute;inset:0;display:grid;place-items:center;
  font-weight:900;font-size:clamp(120px,26vw,210px);line-height:1;
  letter-spacing:-.06em;color:rgba(255,255,255,.16);user-select:none;
}
.card__ph{
  position:absolute;left:12px;bottom:12px;
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 9px;background:rgba(255,255,255,.12);
  font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.75);
}
.card__ph .plus{font-size:7px}
.card__num{
  position:absolute;top:0;right:0;padding:9px 12px;
  background:var(--paper);color:var(--ink);
  font-size:11px;font-weight:800;letter-spacing:.1em;
}
/* pointer-only: on touch this would stick after a tap */
@media (hover:hover){
  .card:hover .card__media i.dots{transform:scale(1.08)}
}

.card__body{
  flex:1;padding:16px 18px 18px;
  display:flex;flex-direction:column;gap:12px;
  border-top:1px solid var(--ink);
}
.card__name{
  margin:0;font-size:clamp(26px,3.4vw,38px);
  font-weight:900;line-height:.94;letter-spacing:-.035em;text-transform:uppercase;
}
/* platform links — the only per-artist action */
.card__links{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px}
.card__links a{
  width:42px;height:42px;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px var(--line);
  transition:background .28s var(--ease),color .28s var(--ease),box-shadow .28s var(--ease);
}
.card__links svg{width:18px;height:18px}
@media (hover:hover){
  .card__links a:hover{background:var(--ink);color:var(--paper);box-shadow:inset 0 0 0 1px var(--ink)}
}
.card__links a:active{background:var(--ink);color:var(--paper)}
.card__links a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* progress */
.rail__foot{padding:clamp(20px,3.5vh,34px) var(--gut) 0;display:flex;align-items:center;gap:20px}
.bar{position:relative;flex:1;height:2px;background:var(--line)}
.bar b{position:absolute;top:0;bottom:0;left:0;width:22%;background:var(--ink);transition:width .18s linear}

/* ============================================================
   FOOTER
   ============================================================ */
.ftr{background:var(--ink);color:var(--white);padding:clamp(52px,9vh,100px) var(--gut) 26px}
.ftr__top{
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:clamp(24px,5vw,60px);
  padding-bottom:clamp(34px,5.5vh,58px);border-bottom:1px solid var(--line-inv);
}
.ftr__cta{margin:0;flex:1 1 320px;font-size:clamp(32px,5.6vw,76px);font-weight:900;line-height:.96;letter-spacing:-.04em;text-transform:uppercase}
.ftr__cta em{font-style:normal;color:var(--ash)}

/* flex, not an auto-fit grid: with only two columns left a 1fr grid stretched
   them across the whole width and the footer read as empty */
.ftr__cols{
  display:flex;flex-wrap:wrap;
  gap:clamp(28px,7vw,96px);
  padding:clamp(34px,5.5vh,56px) 0;
}
.ftr__col{min-width:170px}
.ftr__col h4{margin:0 0 14px;color:rgba(255,255,255,.42)}
.ftr__col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.ftr__col li{font-size:14.5px;line-height:1.45;color:rgba(255,255,255,.88)}
.ftr__col a{position:relative;transition:color .25s var(--ease)}
.ftr__col a::after{
  content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:currentColor;
  transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease);
}
.ftr__col a:hover::after{transform:scaleX(1)}

.ftr__base{
  display:flex;flex-wrap:wrap;gap:12px 26px;align-items:center;
  padding-top:20px;border-top:1px solid var(--line-inv);color:rgba(255,255,255,.4);
}
.ftr__base .eyebrow{font-size:10px}
.ftr__base .sep{margin-left:auto}

/* ============================================================
   RESPONSIVE
   Base styles above are phone-first for anything that changes
   structurally; everything else scales with clamp().
   ============================================================ */

/* ---- long strings must never push the layout wide ---- */
.ftr__col li,.ftr__col a,.card__name,.hero__lede{overflow-wrap:anywhere}
.roster__title,.ftr__cta,.hero__lede{text-wrap:balance}

/* ---- phones ---- */
@media (max-width:720px){
  /* no nav on phones, so the mark centres in the bar rather than hanging left */
  .hdr__nav{display:none}
  .hdr{justify-content:center}
  /* side by side there is no room for both, and the mark would shrink to
     nothing next to a full-width button row — so stack them */
  .hero__inner{flex-direction:column;align-items:stretch;gap:clamp(24px,5vh,44px)}
  .hero__mark{width:100%}
  /* full-width, equal actions read better than two odd-sized buttons */
  .hero__actions{width:100%;gap:8px}
  .hero__actions .btn{flex:1 1 150px;justify-content:center;padding:0 18px}
  .ticker__track span{font-size:10.5px;letter-spacing:.18em;gap:20px;padding-right:20px}
  .ftr__top .btn{width:100%;justify-content:space-between;font-size:10.5px;letter-spacing:.1em;padding:0 16px}
  /* the roster meta drops under the title */
  .roster__aside{width:100%;margin-left:0;flex-wrap:wrap;align-items:center;gap:14px 20px}
  .nav{margin-left:auto}
}

/* ---- very small phones ---- */
@media (max-width:400px){
  .hdr__cta{padding:0 12px;letter-spacing:.1em}
  .hdr__logo{width:96px}
  .card{flex-basis:min(86vw,300px)}
  .rail__foot{gap:12px}
}

/* ---- tablets ---- */
@media (min-width:721px) and (max-width:1023px){
  .card{flex-basis:min(52vw,340px)}
  .roster__aside{gap:24px}
}

/* ---- desktop ---- */
@media (min-width:1024px){
  .card{flex-basis:min(34vw,360px)}
}
@media (min-width:1440px){
  .card{flex-basis:380px}
}

/* ---- large screens: keep the mark from looking lost ---- */
@media (min-width:1800px){
  :root{--gut:80px}
  .hero__mark{width:min(100%,78vh,1240px)}
}

/* ---- short viewports (landscape phones, small laptops) ---- */
@media (max-height:700px){
  .hero{padding-top:calc(var(--bar) + 24px)}
  .hero__inner{gap:20px}
}
@media (max-height:560px) and (orientation:landscape){
  .hero{min-height:auto;padding-bottom:12px}
  .hero__mark{width:min(62%,72vh,700px)}
  .ticker{display:none}
}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .rv{opacity:1;transform:none}
}
</style>
</head>

<script>
/* ---------- roster data (order exactly as briefed) ----------
   photo: null  -> renders the generated placeholder instead
   links: '#'   -> PLACEHOLDER URL, swap for the artist's real profile   */
const PLATFORMS = [
  ['spotify',    'Spotify'],
  ['apple',      'Apple Music'],
  ['beatport',   'Beatport'],
  ['soundcloud', 'SoundCloud'],
  ['instagram',  'Instagram'],
];

/* Real profiles. Share-tracking parameters (igsh / si / utm_* / ref) stripped,
   and on.soundcloud.com shorteners resolved to their canonical profile URLs so
   they can't expire. A platform with no entry simply renders no icon — never a
   dead link, and never one platform's URL behind another's icon. */
const ARTISTS = [
  { name:'Mishell', photo:'img/mishell.jpg', links:{
      spotify:   'https://open.spotify.com/artist/3kCsXVpVs1ZhLnIVkNzdHJ',
      apple:     'https://music.apple.com/il/artist/mishell/250454064',
      beatport:  'https://www.beatport.com/artist/mishell/270228',
      soundcloud:'https://soundcloud.com/mishellmusik',
      instagram: 'https://www.instagram.com/_mishell_____' } },

  /* Spotify missing: the link supplied for it resolved to soundcloud.com/genishmusic */
  { name:'Genish', photo:'img/genish.jpg', links:{
      apple:     'https://music.apple.com/il/artist/genish/787229909',
      beatport:  'https://www.beatport.com/artist/genish/929264',
      soundcloud:'https://soundcloud.com/genishmusic',
      instagram: 'https://www.instagram.com/genish__' } },

  { name:'Yuvee', photo:'img/yuvee.jpg', links:{
      spotify:   'https://open.spotify.com/artist/2uUpxGX8XaVGhqh398dP2f',
      apple:     'https://music.apple.com/il/artist/yuvee/1216600486',
      beatport:  'https://www.beatport.com/artist/yuve/1243590',
      soundcloud:'https://soundcloud.com/yuveemusic',
      instagram: 'https://www.instagram.com/yuvee_music' } },

  /* Still needed for Nevos: Spotify, Apple Music, Beatport */
  { name:'Nevos', photo:'img/nevos.jpg', links:{
      soundcloud:'https://soundcloud.com/nevosmusic',
      instagram: 'https://www.instagram.com/nevos_music' } },

  /* Spotify missing: the link supplied for it resolved to soundcloud.com/mentesh */
  { name:'Mentesh', photo:'img/mentesh.jpg', links:{
      apple:     'https://music.apple.com/il/artist/mentesh/1671188421',
      beatport:  'https://www.beatport.com/artist/mentesh/1109477',
      soundcloud:'https://soundcloud.com/mentesh',
      instagram: 'https://www.instagram.com/guymentesh' } },
];

const media = a => a.photo
  ? `<img src="${a.photo}" alt="${a.name}" loading="lazy" decoding="async" width="900" height="1200">`
  : `<i class="dots"></i><i class="glow"></i><i class="bars"></i>
     <span class="card__initial">${a.name[0]}</span>
     <span class="card__ph"><i class="plus"></i> Image placeholder</span>`;

const links = a => PLATFORMS
  .filter(([key]) => a.links[key])          // no URL, no icon — never a dead link
  .map(([key,label]) => `
  <a href="${a.links[key]}" target="_blank" rel="noopener noreferrer"
     aria-label="${a.name} on ${label}" title="${label}">
    <svg aria-hidden="true"><use href="#ic-${key}"/></svg>
  </a>`).join('');

const pad = n => String(n).padStart(2,'0');

/* everything that counts artists reads the array, so pulling one can't leave a
   stale number behind */
document.getElementById('count').textContent = `01 — ${pad(ARTISTS.length)}`;

const rail = document.getElementById('rail');
rail.innerHTML = ARTISTS.map((a,i) => `
  <article class="card rv" style="transition-delay:${Math.min(i,5)*.06}s">
    <div class="card__media">
      ${media(a)}
      <span class="card__num">${pad(i+1)}</span>
    </div>
    <div class="card__body">
      <h3 class="card__name">${a.name}</h3>
      <div class="card__links">${links(a)}</div>
    </div>
  </article>
`).join('');

/* ticker: artist names only.
   The -50% loop is only seamless while each half is at least as wide as the
   viewport. Six short names are not, so the tail ran out and left a blank
   stretch — repeat the list until one half covers the screen, and scale the
   duration so the speed stays constant however many repeats that takes. */
const tick  = document.getElementById('ticker');
const UNIT  = ARTISTS.map(a => `${a.name} <i class="plus"></i>`).join(' ');
const SPEED = 90; // px per second

const MIN_HALF = 4000; // px — wider than any viewport this is going to run on

function buildTicker(){
  tick.style.animation = 'none';
  tick.innerHTML = `<span>${UNIT}</span>`;
  const unitW = tick.firstElementChild.getBoundingClientRect().width;
  if (!unitW) return;
  // Sizing this to the *current* viewport meant a resize measured mid-layout
  // could lock in too few repeats and reopen the gap. Overshooting instead costs
  // a handful of spans and makes the loop correct whatever the timing.
  const reps = Math.ceil(Math.max(MIN_HALF, window.innerWidth * 2) / unitW);
  const half = `<span>${Array(reps).fill(UNIT).join(' ')}</span>`;
  tick.innerHTML = half + half;
  const halfW = tick.firstElementChild.getBoundingClientRect().width;
  tick.style.animation = '';
  tick.style.animationDuration = (halfW / SPEED) + 's';
}
/* A resize can land mid-layout — the mobile media query changes the ticker's
   font-size, so one pass can measure a transient width and lock in a wrong
   repeat count. buildTicker is idempotent, so run it again after a frame. */
const settle = () => requestAnimationFrame(() => { buildTicker(); requestAnimationFrame(buildTicker); });

buildTicker();
document.fonts?.ready.then(settle);   // name widths change once Archivo lands

/* observe the band itself rather than listening for 'resize' — its width tracks
   the viewport, and this still fires where a resize event doesn't (zoom, devtools
   viewport overrides, a pane being dragged). Rebuilding the track inside doesn't
   change the band's own width, so this can't feed back on itself. */
let tickTimer;
const rebuild = () => { clearTimeout(tickTimer); tickTimer = setTimeout(settle, 180); };
new ResizeObserver(rebuild).observe(tick.parentElement);
window.addEventListener('resize', rebuild);

/* ---------- carousel ---------- */
const prog = document.getElementById('prog');
const [btnPrev, btnNext] = document.querySelectorAll('.nav button');

const step = () => (rail.querySelector('.card')?.offsetWidth || 320) + 1;
const maxScroll = () => rail.scrollWidth - rail.clientWidth;

function sync(){
  const max = maxScroll();
  const pos = rail.scrollLeft;
  const p   = max > 0 ? pos / max : 0;
  prog.style.width = (12 + p * 88) + '%';
  btnPrev.disabled = pos < 4;
  btnNext.disabled = pos > max - 4;
}
rail.addEventListener('scroll', sync, {passive:true});
window.addEventListener('resize', sync);

document.querySelectorAll('.nav button').forEach(b => {
  b.addEventListener('click', () => {
    rail.scrollBy({ left: step() * Number(b.dataset.dir), behavior:'smooth' });
  });
});

rail.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  rail.scrollBy({ left: step() * (e.key === 'ArrowRight' ? 1 : -1), behavior:'smooth' });
});

/* Drag to scroll (mouse/pen; touch scrolls natively).
   The pointer is captured only once the gesture is genuinely a drag. Capturing
   on pointerdown retargets the follow-up click to the rail, which silently broke
   every card link. */
/* Generous on purpose. A real mouse click on a 42px icon drifts several pixels
   between press and release; the old 4px threshold read that as a drag and
   cancelled the click, which is why the card links felt dead. */
const DRAG_THRESHOLD = 12; // px
let down = false, dragging = false, startX = 0, startScroll = 0, pid = null, swallowClick = false;

rail.addEventListener('pointerdown', e => {
  swallowClick = false;
  if (e.pointerType === 'touch' || e.button !== 0) return;
  down = true; dragging = false; pid = e.pointerId;
  startX = e.clientX; startScroll = rail.scrollLeft;
});

rail.addEventListener('pointermove', e => {
  if (!down) return;
  const d = e.clientX - startX;
  if (!dragging) {
    if (Math.abs(d) <= DRAG_THRESHOLD) return;   // still a click — leave links alone
    dragging = true;
    rail.classList.add('is-drag');
    try { rail.setPointerCapture(pid); } catch {}
  }
  rail.scrollLeft = startScroll - d;
});

const endDrag = () => {
  if (!down) return;
  down = false;
  if (dragging) {
    // only eat the click if the rail actually moved — at a scroll boundary a
    // drag goes nowhere, and swallowing there would kill a legitimate click
    swallowClick = Math.abs(rail.scrollLeft - startScroll) > 2;
    rail.classList.remove('is-drag');
    try { rail.releasePointerCapture(pid); } catch {}
  }
  dragging = false;
};
rail.addEventListener('pointerup', endDrag);
rail.addEventListener('pointercancel', endDrag);

rail.addEventListener('click', e => {
  if (!swallowClick) return;
  e.preventDefault(); e.stopPropagation();
  swallowClick = false;
}, true);

sync();
window.addEventListener('load', sync);

/* ---------- reveal on scroll ---------- */
const io = new IntersectionObserver((entries) => {
  entries.forEach(en => { if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
}, { rootMargin:'0px 0px -8% 0px', threshold:0.08 });
document.querySelectorAll('.rv').forEach(el => io.observe(el));
</script>
</body>
</html>
